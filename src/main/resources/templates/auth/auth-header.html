<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="auth-header(activePage)" class="luxury-auth-header d-flex justify-content-between align-items-center">
    <!-- Left: Guest link -->
    <div class="d-flex align-items-center gap-3">
        <a th:href="@{/}" class="auth-header-link d-flex align-items-center gap-2">
            <i class="bi bi-person"></i>
            <span>Tiếp tục với vai trò Khách</span>
        </a>
    </div>

    <!-- Center: Brand Logo -->
    <div class="auth-brand-center">
        <a th:href="@{/}" class="text-decoration-none">
            <h1 class="auth-brand-name">FASHION SHOP</h1>
            <span class="auth-brand-sub">STUDIO & ATELIER</span>
        </a>
    </div>

    <!-- Right: Navigation links -->
    <div class="auth-header-nav">
        <a href="#">CHĂM SÓC KHÁCH HÀNG</a>
        <a href="#">GHÉ THĂM ATELIER</a>
        <span class="text-secondary fw-semibold">VI / EN</span>
        <a th:href="@{/login}" th:if="${activePage == 'register'}" class="btn btn-sm btn-dark rounded-circle p-1 px-2">
            <i class="bi bi-person-fill text-white"></i>
        </a>
    </div>
</header>

</body>
</html>
