<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="site-header sticky-top">
    <nav class="navbar navbar-expand-lg site-navbar">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand site-brand d-flex align-items-center gap-2" th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="Fashion Shop" class="site-brand-logo">
                <span class="site-brand-name">FASHION SHOP</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">

                <!-- 1. Menu điều hướng -->
                <ul th:replace="~{fragments/header/main-menu :: main-menu}"></ul>

                <!-- Bên phải: tìm kiếm, yêu thích, giỏ hàng, tài khoản -->
                <div class="d-flex align-items-center gap-3 site-actions">

                    <!-- 2. Ô tìm kiếm -->
                    <div th:replace="~{fragments/header/search-box :: search-box}"></div>

                    <!-- 3. Yêu thích -->
                    <a th:replace="~{fragments/header/wishlist-icon :: wishlist-icon}"></a>

                    <!-- 4. Giỏ hàng -->
                    <a th:replace="~{fragments/header/cart-icon :: cart-icon}"></a>

                    <!-- 5. Tài khoản / Đăng nhập -->
                    <div th:replace="~{fragments/header/user-menu :: user-menu}"></div>

                </div>
            </div>
        </div>
    </nav>
</header>




</body>
</html>
