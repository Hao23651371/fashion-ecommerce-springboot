<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toast">
    <div id="loginSuccessToast" class="fs-login-toast" style="display: none;" role="alert" aria-live="polite">
        <div class="fs-toast-body">
            <div class="fs-toast-icon">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <div class="fs-toast-content">
                <div class="fs-toast-title">Đăng nhập thành công!</div>
                <div class="fs-toast-desc">Chào mừng bạn đã quay trở lại với Fashion Shop.</div>
            </div>
            <button type="button" class="fs-toast-close" onclick="closeLoginToast()" aria-label="Đóng">&times;</button>
        </div>
        <div class="fs-toast-progress">
            <div class="fs-toast-progress-bar"></div>
        </div>
    </div>

    <style>
        .fs-login-toast {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 999999;
            min-width: 320px;
            max-width: 400px;
            background: #ffffff;
            color: #1e293b;
            border-radius: 14px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.16), 0 4px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(25, 135, 84, 0.25);
            overflow: hidden;
            animation: fsSlideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        .fs-toast-body {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px 14px 18px;
        }

        .fs-toast-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(25, 135, 84, 0.12);
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.45rem;
            flex-shrink: 0;
            box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.06);
        }

        .fs-toast-content {
            flex-grow: 1;
        }

        .fs-toast-title {
            font-size: 0.96rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
            line-height: 1.3;
        }

        .fs-toast-desc {
            font-size: 0.82rem;
            color: #64748b;
            line-height: 1.4;
        }

        .fs-toast-close {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }

        .fs-toast-close:hover {
            color: #334155;
        }

        .fs-toast-progress {
            height: 3px;
            background: rgba(25, 135, 84, 0.12);
            width: 100%;
            overflow: hidden;
        }

        .fs-toast-progress-bar {
            height: 100%;
            background: #198754;
            width: 100%;
            animation: fsToastProgress 3s linear forwards;
        }

        .fs-toast-fade-out {
            animation: fsSlideOutRight 0.35s ease forwards !important;
        }

        @keyframes fsSlideInRight {
            from {
                opacity: 0;
                transform: translateX(60px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes fsSlideOutRight {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(60px) scale(0.95);
            }
        }

        @keyframes fsToastProgress {
            from { width: 100%; }
            to { width: 0%; }
        }

        @media (max-width: 576px) {
            .fs-login-toast {
                top: 16px;
                right: 16px;
                left: 16px;
                min-width: auto;
                max-width: none;
            }
        }
    </style>

    <script>
        function closeLoginToast() {
            const toast = document.getElementById('loginSuccessToast');
            if (toast) {
                toast.classList.add('fs-toast-fade-out');
                setTimeout(() => { toast.remove(); }, 350);
            }
        }

        (function () {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('loginSuccess') === 'true') {
                    const toast = document.getElementById('loginSuccessToast');
                    if (toast) {
                        toast.style.display = 'block';

                        // Xóa sạch param ?loginSuccess=true khỏi URL bar mà không reload trang
                        const url = new URL(window.location.href);
                        url.searchParams.delete('loginSuccess');
                        const newUrl = url.pathname + (url.search ? url.search : '') + url.hash;
                        window.history.replaceState({}, document.title, newUrl);

                        // Tự động đóng sau đúng 3 giây (3000ms)
                        setTimeout(() => {
                            closeLoginToast();
                        }, 3000);
                    }
                }
            } catch (e) {
                console.error("Lỗi thông báo đăng nhập:", e);
            }
        })();
    </script>
</div>
</body>
</html>
