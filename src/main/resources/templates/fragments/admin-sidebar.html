<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activeMenu)" class="admin-sidebar d-flex flex-column justify-content-between">
    <!-- Top Part -->
    <div>
        <!-- Logo Header + nút 3 gạch -->
        <div class="sidebar-logo-area d-flex align-items-center gap-3 p-3 pb-4">
            <div class="brand-badge-red">
                <img th:src="@{/images/logo.png}" alt="Fashion Shop" class="brand-logo-img">
            </div>
            <div class="brand-title">
                <h6 class="m-0 fw-bold text-white tracking-wide">FASHION SHOP</h6>
                <small class="text-secondary font-monospace" style="font-size: 0.7rem;">STUDIO & ATELIER</small>
            </div>

            <!-- Nút 3 gạch: thu gọn sidebar -->
            <button type="button" class="sidebar-toggle-btn ms-auto" data-sidebar-toggle aria-label="Thu gọn menu">
                <i class="bi bi-list"></i>
            </button>
        </div>

        <!-- Section Title -->
        <div class="px-3 mb-2">
            <span class="sidebar-section-title">QUẢN LÝ CỬA HÀNG</span>
        </div>

        <!-- Navigation Links -->
        <nav class="sidebar-nav px-2">
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a th:href="@{/admin/dashboard}"
                       th:class="'nav-link d-flex align-items-center justify-content-between ' + (${activeMenu == 'dashboard' or activeMenu == null} ? 'active' : '')">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-grid-fill"></i>
                            <span>Bảng điều khiển</span>
                        </div>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/categories}"
                       th:class="'nav-link d-flex align-items-center justify-content-between ' + (${activeMenu == 'categories'} ? 'active' : '')">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-boxes"></i>
                            <span>Quản lý Danh Mục</span>
                        </div>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/products}"
                       th:class="'nav-link d-flex align-items-center justify-content-between ' + (${activeMenu == 'products'} ? 'active' : '')">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-tag-fill"></i>
                            <span>Quản lý Sản phẩm</span>
                        </div>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/inventory}"
                       th:class="'nav-link d-flex align-items-center justify-content-between ' + (${activeMenu == 'inventory'} ? 'active' : '')">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-box-seam-fill"></i>
                            <span>Quản lý Kho</span>
                        </div>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/orders}"
                       th:class="'nav-link d-flex align-items-center justify-content-between ' + (${activeMenu == 'orders'} ? 'active' : '')">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-bag-check-fill"></i>
                            <span>Quản lý Đơn hàng</span>
                        </div>

                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/statistics}"
                       th:class="'nav-link d-flex align-items-center justify-content-between ' + (${activeMenu == 'statistics'} ? 'active' : '')">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-bar-chart-line-fill"></i>
                            <span>Thống kê</span>
                        </div>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/coupons}"
                       th:class="'nav-link d-flex align-items-center justify-content-between ' + (${activeMenu == 'coupons'} ? 'active' : '')">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-ticket-perforated-fill"></i>
                            <span>Quản lý Mã giảm giá</span>
                        </div>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/users}"
                       th:class="'nav-link d-flex align-items-center justify-content-between ' + (${activeMenu == 'users'} ? 'active' : '')">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-people-fill"></i>
                            <span>Quản lý Tài khoản</span>
                        </div>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Bottom Part -->
    <div class="sidebar-footer p-3">
        <!-- Admin Account / Avatar Card -->
        <a th:href="@{/admin/account}"
           th:class="'admin-user-card mb-2 d-flex align-items-center justify-content-between p-2 rounded text-decoration-none ' + (${activeMenu == 'account'} ? 'active' : '')"
           title="Trang tài khoản đăng nhập">
            <div class="d-flex align-items-center gap-2 overflow-hidden">
                <div class="position-relative flex-shrink-0">
                    <div class="admin-avatar-circle d-flex align-items-center justify-content-center text-white fw-bold">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <span class="status-indicator-green position-absolute bottom-0 end-0"></span>
                </div>
                <div class="lh-sm text-truncate">
                    <div class="text-white fw-semibold small text-truncate"
                         th:text="${currentUserName != null ? currentUserName : (currentEmail != null ? currentEmail : 'Quản trị viên')}">
                        Admin
                    </div>
                    <small class="text-secondary" style="font-size: 0.72rem;">Tài khoản đăng nhập</small>
                </div>
            </div>
            <i class="bi bi-chevron-right text-secondary ms-1" style="font-size: 0.75rem;"></i>
        </a>

        <!-- Đăng xuất -->
        <a th:href="@{/logout}" class="sidebar-link-muted sidebar-link-logout d-flex align-items-center gap-2 text-decoration-none">
            <i class="bi bi-box-arrow-right"></i>
            <span>Đăng xuất</span>
        </a>

    </div>
</aside>

</body>
</html>
