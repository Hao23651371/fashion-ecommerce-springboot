<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="adminLayout(title, content, activeMenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Admin Dashboard | Fashion Shop</title>

    <!-- Google Fonts & Bootstrap 5 & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Theme & Admin Styles -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body class="admin-body">

<div class="admin-app-layout">
    <!-- 1. CỘT TRÁI: SIDEBAR ADMIN MENU -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar(${activeMenu})}"></div>

    <!-- 2. CỘT PHẢI: KHU VỰC NỘI DUNG CHÍNH -->
    <div class="admin-main-wrapper">
        <!-- Topbar -->
        <header class="admin-topbar d-flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom">
            <div class="d-flex align-items-center gap-3">
                <!-- Nút mở sidebar: hiện trên mobile, hoặc trên desktop khi sidebar đang ẩn -->
                <button class="btn btn-sm btn-outline-secondary sidebar-open-btn" data-sidebar-toggle type="button" aria-label="Mở menu">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <h5 class="m-0 fw-bold text-dark" th:text="${pageTitle != null ? pageTitle : 'Bảng điều khiển'}">Bảng điều khiển</h5>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/admin/account}" class="text-decoration-none d-flex align-items-center gap-2 bg-light px-3 py-1 rounded-pill border text-dark">
                    <i class="bi bi-shield-lock text-primary"></i>
                    <span class="small fw-semibold" th:text="${currentUserName != null ? currentUserName : 'Quản trị viên'}">Quản trị viên</span>
                </a>

            </div>
        </header>

        <!-- KHUNG CHỨA NỘI DUNG CÁC TRANG CON -->
        <main class="admin-content-container p-4">
            <div th:replace="${content}">
                <!-- Content placeholder -->
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        const KEY = 'adminSidebarCollapsed';
        const isDesktop = () => window.innerWidth >= 992;

        // Khôi phục trạng thái thu gọn (chỉ áp dụng trên màn hình lớn)
        try {
            if (isDesktop() && localStorage.getItem(KEY) === '1') {
                document.body.classList.add('sidebar-collapsed');
            }
        } catch (e) { /* bỏ qua nếu trình duyệt chặn localStorage */ }

        document.querySelectorAll('[data-sidebar-toggle]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (isDesktop()) {
                    const collapsed = document.body.classList.toggle('sidebar-collapsed');
                    try { localStorage.setItem(KEY, collapsed ? '1' : '0'); } catch (e) {}
                } else {
                    document.querySelector('.admin-sidebar').classList.toggle('show');
                }
            });
        });
    })();
</script>
</body>
</html>
