<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Fashion Shop Studio & Atelier</title>

    <!-- Google Fonts & Bootstrap 5 & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Theme & Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/customer/product-card.css}">
</head>
<body class="customer-site">

<!-- 1. BỌC HEADER CHUNG TRANG KHÁCH HÀNG -->
<div th:replace="~{fragments/user-header :: header}"></div>

<!-- 2. KHUNG BỌC NỘI DUNG CHÍNH (Tự giãn cách & căn lề chuẩn) -->
<main class="customer-main-wrapper container py-4">
    <div th:replace="${content}">
        <!-- Nội dung trang con (Trang chủ, Chi tiết SP, Giỏ hàng...) sẽ nhảy vào đây -->
    </div>
</main>

<!-- 3. BỌC FOOTER CHUNG -->
<div th:replace="~{fragments/user-footer :: footer}"></div>

<!-- 4. KHUNG CHAT TRỢ LÝ AI -->
<div th:replace="~{fragments/chatbox :: chatbox}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
