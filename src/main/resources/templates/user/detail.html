<!DOCTYPE html>

          ~{::#customer-content}

<head>
    <title>Chi tiết sản phẩm | Fashion Shop</title>
</head>
<body>

            <p class="mt-3 mb-0 small">Mã sản phẩm: <strong th:text="${productId}"></strong></p>
        </div>
    </div>

</body>
</html>
