spring.application.name=FashionShop
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false

# HikariCP: Cấu hình phát hiện lỗi kết nối CSDL nhanh
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.validation-timeout=1500

# Cấu hình dịch vụ gửi Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:fashionshop.iuh2026@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================================
# CẤU HÌNH SPRING AI CHO GOOGLE GEMINI
# =========================================================================
# Tự động lấy key từ gemini.api-key hoặc GEMINI_API_KEY ở file application-local.properties
spring.ai.openai.api-key=${gemini.api-key:${GEMINI_API_KEY:dummy-gemini-key}}

# Endpoint OpenAI-compatible của Google Gemini (giữ nguyên):
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/

# Model Gemini sử dụng:
spring.ai.openai.chat.options.model=${gemini.model:gemini-2.0-flash}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=500


# =========================================================================
# CẤU HÌNH CHATBOT (gemini | ollama)
# =========================================================================
chatbot.provider=gemini
chatbot.fallback-to-ollama=false
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash

shop.bank.id=MB
shop.bank.name=MB Bank
shop.bank.account=0123456789
shop.bank.holder=NGUYEN VAN A
shop.bank.memo=FASHIONSHOP