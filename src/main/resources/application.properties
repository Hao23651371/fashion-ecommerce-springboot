spring.application.name=FashionShop
spring.config.import=optional:classpath:application-local.properties

# =========================================================================
# CẤU HÌNH CỔNG MÁY CHỦ (SERVER PORT)
# Tự động nhận biến $PORT do Cloud cấp (Render / Railway), mặc định 8080 trên Local
# =========================================================================
server.port=${PORT:8080}

# =========================================================================
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU (DATASOURCE)
# Ưu tiên lấy biến môi trường Cloud; nếu không có thì fallback về localhost
# (hoặc được ghi đè bởi application-local.properties trên máy local)
# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/fashionshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

# HikariCP: Giữ pool kết nối ấm và tối ưu hiệu năng mạng trên Cloud
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# =========================================================================
# CẤU HÌNH PHIÊN ĐĂNG NHẬP (SESSION TIMEOUT)
# Mặc định là 30 phút. Đã tăng lên 7 ngày (7d = 168 giờ = 10.080 phút)
# =========================================================================
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d

# Cấu hình dịch vụ gửi Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:fashionshop.iuh2026@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tagnezakiobqpihm}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# =========================================================================
# CẤU HÌNH SPRING AI CHO GOOGLE GEMINI
# =========================================================================
# Tự động lấy key từ GEMINI_API_KEY, fallback về key giả định để không làm sập ứng dụng khi khởi động
spring.ai.openai.api-key=${GEMINI_API_KEY:dummy-gemini-key-placeholder}

# Endpoint OpenAI-compatible của Google Gemini:
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions

# Model Gemini sử dụng:
spring.ai.openai.chat.options.model=${gemini.model:gemini-flash-lite-latest}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=500


# =========================================================================
# CẤU HÌNH CHATBOT (gemini | ollama)
# =========================================================================
chatbot.provider=gemini
chatbot.fallback-to-ollama=false
gemini.api-key=${GEMINI_API_KEY:dummy-gemini-key-placeholder}
gemini.model=gemini-flash-lite-latest

