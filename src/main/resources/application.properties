spring.application.name=FashionShop
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false

# HikariCP: Cấu hình phát hiện lỗi kết nối CSDL nhanh
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.validation-timeout=1500

# Cấu hình dịch vụ gửi Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:fashionshop.iuh2026@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



# =========================================================================
# CẤU HÌNH CHATBOT AI PROVIDER (ollama | gemini)
# =========================================================================
chatbot.provider=ollama
chatbot.fallback-to-ollama=false

# Cấu hình Google Gemini (để trống key và model ở đây; ghi đè key thật trong application-local.properties)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=
gemini.timeout-seconds=15
gemini.max-output-tokens=350
gemini.temperature=0.3
gemini.cooldown-seconds=60
gemini.cache-seconds=600